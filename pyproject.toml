[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nopekit"
version = "0.1.0"
description = "Take a sketch or a discussion to a validated physical thing — claims, gates, packs, and an honest readiness report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Eric Neuman" }]
keywords = ["hardware", "cad", "simulation", "validation", "agents", "manufacturing", "design"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# The spine is STDLIB ONLY, on purpose: it must never be the reason an install
# fails. Packs declare their own dependencies and degrade to BLOCKED, visibly,
# when a solver is absent.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nopekit = "nopekit.cli:main"

[project.urls]
Homepage = "https://github.com/neuman/nopekit"
Source = "https://github.com/neuman/nopekit"

# The bundled packs live at <repo>/packs for contributors (ordinary directories,
# no build step) and are mapped onto `nopekit.bundled` so they ALSO ship in the
# wheel. Without this, `pip install nopekit` produced a working spine with zero
# gates — a spine that cannot do anything. Packages are listed explicitly because
# `packages.find` only scans `where`, so the mapped name is never discovered.
# `tests/test_packaging.py` goes red when this list drops `nopekit.bundled` or
# becomes a find table: no glob below ships a file from a package not built.
[tool.setuptools]
packages = ["nopekit", "nopekit.bundled"]

[tool.setuptools.package-dir]
"" = "src"
"nopekit.bundled" = "packs"

[tool.setuptools.package-data]
nopekit = [
  "py.typed",
  # The site scaffold `nopekit site init` copies. Shipped by glob, not by
  # filename: a template that grows a file and does not grow a line here is a
  # site that scaffolds broken from the wheel and fine from a checkout.
  "site_template/**/*",
]
# A pack is an ordinary directory of whatever it needs — gates, helper modules,
# fixtures, meshes, reference docs, scaffolds. Enumerating a few known shapes is
# how `bomlib.py` (a pack-root helper) silently failed to ship and every gate in
# that pack died on import from the wheel. Ship everything a pack contains, by
# extension, at any depth.
#
# The list still drifted: until general-packs P2 it shipped no KiCad board, SPICE
# deck, Modelica model or OpenFOAM case, so the wheel held the pcb-kicad,
# openmodelica, cfd-openfoam and aero-openfoam baselines without the files they
# read. `tests/test_packaging.py` now walks `git ls-files packs/` and
# names each tracked file no glob here ships. `**/*` was rejected: setuptools
# globs the tree as it is on disk, so it would ship a contributor's
# `__pycache__/` and a solver run left in a case directory, and its `*` still
# skips a dotfile.
"nopekit.bundled" = [
  "**/*.py", "**/*.json", "**/*.md", "**/*.txt",
  "**/*.stl", "**/*.step", "**/*.csv", "**/*.yaml", "**/*.yml",
  # KiCad: the board, its project, schematic and custom rules, and the two
  # library tables (no extension) that KiCad reads from the board's directory.
  "**/*.kicad_pcb", "**/*.kicad_pro", "**/*.kicad_sch", "**/*.kicad_dru",
  "**/fp-lib-table", "**/sym-lib-table",
  # ngspice decks and OpenModelica models.
  "**/*.cir", "**/*.mo",
  # OpenFOAM: a case is extensionless dictionaries in three directories, the
  # three that the packs' stage copies from (`CASE_DIRS`, `gates/_tool.py`).
  # Anchored at a case root, `<pack>/selftest/assets/<case>/`, and one level
  # deep, as the stage copies. So `constant/polyMesh/`, a time directory but 0,
  # `processor*/` and `postProcessing/` of a run left in place stay out. A case
  # put anywhere else reads unshipped in tests/test_packaging.py and gets its
  # own lines here. Rejected: each dictionary by name (a field file is named by
  # its variable, U, p, k, omega, so a case that adds a field would not ship
  # it); and `**/0/*`, `**/constant/*`, `**/system/*`, which match a directory
  # of that name at any depth, so they shipped `processor0/0/U` and
  # `postProcessing/forces/0/force.dat` (review of general-packs P2).
  "*/selftest/assets/*/0/*", "*/selftest/assets/*/constant/*",
  "*/selftest/assets/*/system/*",
  # ParaView: the renderer control's dataset (`views/fixture/strip.vtk`) and the
  # environment file that `references/rendering.md` installs from.
  "**/*.vtk", "**/*.lock",
  # A pack's own ignore file. glob's `*` never matches a leading dot, so no
  # glob above ships it.
  "**/.gitignore",
  # Added before the files arrive, so that later phases of general-packs only
  # delete lines here: hand-ergonomics' scene meshes, and firmware-ci's ESP-IDF
  # sources and defaults (its CMakeLists.txt matches `**/*.txt`).
  "**/*.glb", "**/*.c", "**/sdkconfig.defaults",
  # firmware-zmk: the wrapper its gates compare byte for byte (no extension), and
  # its baseline's ZMK files. Without them every build gate errors from the wheel.
  "**/bin/*", "**/*.keymap", "**/*.conf", "**/LICENSE",
]
