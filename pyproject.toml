[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nopekit"
version = "0.1.0"
description = "Take a sketch or a discussion to a validated physical thing — claims, gates, packs, and an honest readiness report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Eric Neuman" }]
keywords = ["hardware", "cad", "simulation", "validation", "agents", "manufacturing", "design"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# The spine is STDLIB ONLY, on purpose: it must never be the reason an install
# fails. Packs declare their own dependencies and degrade to BLOCKED, visibly,
# when a solver is absent.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nopekit = "nopekit.cli:main"

[project.urls]
Homepage = "https://github.com/neuman/nopekit"
Source = "https://github.com/neuman/nopekit"

# The bundled packs live at <repo>/packs for contributors (ordinary directories,
# no build step) and are mapped onto `nopekit.bundled` so they ALSO ship in the
# wheel. Without this, `pip install nopekit` produced a working spine with zero
# gates — a spine that cannot do anything. Packages are listed explicitly because
# `packages.find` only scans `where`, so the mapped name is never discovered.
[tool.setuptools]
packages = ["nopekit", "nopekit.bundled"]

[tool.setuptools.package-dir]
"" = "src"
"nopekit.bundled" = "packs"

[tool.setuptools.package-data]
nopekit = [
  "py.typed",
  # The site scaffold `nopekit site init` copies. Shipped by glob, not by
  # filename: a template that grows a file and does not grow a line here is a
  # site that scaffolds broken from the wheel and fine from a checkout.
  "site_template/**/*",
]
# A pack is an ordinary directory of whatever it needs — gates, helper modules,
# fixtures, meshes, reference docs, scaffolds. Enumerating a few known shapes is
# how `bomlib.py` (a pack-root helper) silently failed to ship and every gate in
# that pack died on import from the wheel. Ship everything a pack contains, by
# extension, at any depth.
"nopekit.bundled" = [
  "**/*.py", "**/*.json", "**/*.md", "**/*.txt",
  "**/*.stl", "**/*.step", "**/*.csv", "**/*.yaml", "**/*.yml",
]
