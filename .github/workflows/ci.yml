# SPDX-License-Identifier: Apache-2.0
name: ci

# The spine is standard-library only, so this workflow installs nothing to test it.
# That is the point: if CI needs a dependency to run the spine, so does a user, and
# the spine has failed its own constraint.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Spine imports with no third-party packages installed
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          # Parse rather than grep: a string containing "import numpy" is not an import,
          # and an import inside a function still binds the spine to a dependency.
          STDLIB = set(sys.stdlib_module_names)
          bad = []
          for path in pathlib.Path("src/atompipe").rglob("*.py"):
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:          # relative import, always ours
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in STDLIB and name != "atompipe":
                          bad.append(f"{path}: {name}")
          if bad:
              raise SystemExit("spine imports non-stdlib modules:\n  " + "\n  ".join(bad))
          print(f"stdlib-only: clean")
          PY

      - name: Honesty invariants and pack gates
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Every pack validates, and demonstrates
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, sys
          from atompipe import packs
          failed = False
          for name in sorted(os.listdir("packs")):
              d = os.path.join("packs", name)
              if not os.path.isfile(os.path.join(d, "pack.json")):
                  continue
              # What validate could not demonstrate here (no trimesh, no omc on a
              # runner) comes back as notes. Printed, never dropped: a gate that
              # was not demonstrated must not pass for one that was (S-12).
              notes = []
              problems = packs.validate(d, notes=notes)
              print(f"{name}: {'ok' if not problems else problems}")
              for note in notes:
                  print(f"  note: {note}")
              failed |= bool(problems)
          sys.exit(1 if failed else 0)
          PY

      # What slipped through (S-11): the docs said CI runs `gate selftest` over
      # every pack, and CI ran it only inside the bracket, which loads no pack. At
      # the repo root there is no project, so `gate selftest` runs pack mode: each
      # bundled pack's baseline must pass and every control must fire.
      - name: Every bundled pack's gates prove they can fail
        run: PYTHONPATH=src python -m atompipe gate selftest --junit "$RUNNER_TEMP/selftest-packs.xml"

      # The bracket fails on purpose (thickness 7.0: 0.70 mm of sag against a 0.5 mm
      # limit), so `check` exits 1 in every correct build. What slipped through
      # (S-83): this step ran `check || true`, which reads a crash (exit 2), a second
      # failure and the intended failure going away exactly like the one intended
      # failure; and it ran `init` and `model --set-entry` in the TRACKED directory,
      # rewriting committed files on every run. Now it runs in a temp copy, the exit
      # code is captured rather than swallowed, and code plus JUnit report must equal
      # tests/expected_bracket.json.
      #
      # `--force` (R-9): from 1.2 `check` serves the committed verdict cache, and an
      # entry is only as honest as whoever committed it — a hand-placed one, or one a
      # spine with a since-fixed bug wrote, would read green here forever without a
      # gate running. The inner loop may trust the cache; CI is a money boundary, so
      # it re-runs every gate and its control and compares.
      - name: Reference project fails exactly as pinned, and its gates prove they can fail
        run: |
          copy="$(mktemp -d)/bracket"
          cp -R examples/bracket "$copy"
          rc=0
          PYTHONPATH=src python -m atompipe -C "$copy" check --force --junit || rc=$?
          python tests/oracle/bracket_signature.py "$copy/.atompipe/out/junit.xml" tests/expected_bracket.json --exit-code "$rc"
          # This one must pass. A gate that passes its own known-bad fixture is a
          # logger, and merging one is the failure this whole project exists to stop.
          PYTHONPATH=src python -m atompipe -C "$copy" gate selftest --junit
